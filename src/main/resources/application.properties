spring.application.name=portfolio-studio
server.port=8080

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

spring.datasource.url=jdbc:sqlite:storage/database/portfolio.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON; PRAGMA journal_mode=WAL;

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=true
# Tomcat 10.1.42+ counts every multipart field (not just files). Default 10 is too low for CMS forms.
server.tomcat.max-part-count=100
server.tomcat.max-part-header-size=1024

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.mixed=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

portfolio.storage.upload-root=storage/uploads
# First-boot CMS owner is not stored in git. Copy
# application-local.properties.example to application-local.properties
# for a new local database, or set the matching variables in
# /etc/portfolio.env on the server. Seed runs only when cms_users is empty.
spring.config.import=optional:file:./application-local.properties
portfolio.security.login-lock-threshold=5
portfolio.security.login-lock-minutes=15
