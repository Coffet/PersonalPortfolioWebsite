location / {
    root /var/www/forefront;
    index index.html;
    try_files $uri $uri/ =404;

    # The static page is self-contained (inline <style> + inline <script>) apart
    # from the Instrument Sans webfont on Google Fonts, which the app's CSP also
    # allows. add_header does not inherit down a level, so the rest of the
    # security headers are re-declared here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
