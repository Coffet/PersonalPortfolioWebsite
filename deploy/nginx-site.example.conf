# Example site config for coft.moe on Linode (nginx).
# 1. Copy portfolio files to /var/www/coft.moe (or your path).
# 2. Copy nginx-security-headers.conf to /etc/nginx/snippets/
# 3. Adapt paths, then link from sites-enabled:
#    sudo ln -s /etc/nginx/sites-available/coft.moe /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name coft.moe www.coft.moe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coft.moe www.coft.moe;

    root /var/www/coft.moe;
    index index.html;

    # Certbot (Let's Encrypt) paths — adjust if you use another tool
    ssl_certificate     /etc/letsencrypt/live/coft.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coft.moe/privkey.pem;

    include /etc/nginx/snippets/nginx-security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
