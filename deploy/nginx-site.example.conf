# Reverse proxy for coft.moe. Visitors hit nginx; Java stays on 127.0.0.1:8080.
# 1. Copy nginx-security-headers.conf to /etc/nginx/snippets/
# 2. Copy this file to /etc/nginx/sites-available/portfolio
# 3. sudo ln -sfn /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
# 4. sudo nginx -t && sudo systemctl reload nginx
#
# Replace the self-signed cert paths with Cloudflare origin or Let's Encrypt files.

server {
    listen 80;
    listen [::]:80;
    server_name coft.moe www.coft.moe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coft.moe www.coft.moe; # Adjust this to your domain

    ssl_certificate     /etc/ssl/cf/coft.moe.pem; # Adjust this to your certificate path
    ssl_certificate_key /etc/ssl/cf/coft.moe.key; # Adjust this to your certificate key path

    include /etc/nginx/snippets/nginx-security-headers.conf;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
