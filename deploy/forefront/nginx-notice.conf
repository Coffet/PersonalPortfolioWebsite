# Forefront notice wiring for the `server {}` block in nginx-site.example.conf.
#
# Install
#   1. sudo mkdir -p /var/www/forefront
#   2. copy deploy/forefront/unpaid.html  (or index.html) to /var/www/forefront/index.html
#   3. paste the lines below inside the https server {} block
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# Manual switch, over SSH:
#   sudo touch /etc/portfolio-down     -> visitors get the notice
#   sudo rm /etc/portfolio-down        -> normal site returns
#   (no reload needed; the file is checked per request)

# The notice is served only through error_page, so /notice.html is not a public URL.
location = /notice.html {
    internal;
    alias /var/www/forefront/index.html;
}

# Replace upstream failures with the notice. A dead Java process, a stopped
# service, or a deploy all land here as long as nginx itself is alive.
# 503 is the honest status: the site exists but cannot serve right now.
error_page 502 503 504 =503 /notice.html;
proxy_intercept_errors on;

location / {
    # Flag-file switch. `if` + `return` is the safe, documented use of if.
    if (-f /etc/portfolio-down) {
        return 503;
    }

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
}
