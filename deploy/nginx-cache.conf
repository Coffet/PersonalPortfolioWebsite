# Add inside the same server { } block as your site (Linode / nginx).
# Caches images/CSS/JS at browser + Cloudflare edge.

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/css text/javascript application/javascript image/svg+xml;

location ~* \.(css|js|webp|png|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}
